name = "eriaflow-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "49c88b6d64e562f816def0c5a77811d4"

# ─── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "eriaflow-db"
database_id = "80f714a5-c1f1-4fed-85c4-b6cdfbfa1dce"

# ─── Queues (Follow-up automation) ───────────────────────────────────────────
[[queues.producers]]
binding = "FOLLOWUP_QUEUE"
queue = "eriaflow-followups"

[[queues.consumers]]
queue = "eriaflow-followups"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3

# ─── KV (Rate limiting & caching) ────────────────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "d04bebd62cdf4f0096449a3550d52853"

# ─── Environment Variables (secrets via wrangler secret put) ─────────────────
[vars]
ENVIRONMENT = "development"
API_VERSION = "v1"
CORS_ORIGIN = "http://localhost:3000"

# ─── Secrets (set via: wrangler secret put SECRET_NAME) ─────────────────────
# SUPABASE_JWT_SECRET
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# GOOGLE_GENERATIVE_AI_API_KEY
# DEEPSEEK_API_KEY
# WHATSAPP_VERIFY_TOKEN
# WHATSAPP_ACCESS_TOKEN
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET

# ─── Production overrides ────────────────────────────────────────────────────
[env.production]
[env.production.vars]
ENVIRONMENT = "production"
CORS_ORIGIN = "https://eriaflow.pages.dev"
